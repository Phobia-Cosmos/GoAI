[project]
name = "goai-data"
version = "0.1.0"
description = "Read-only data normalization pipeline for the enterprise sandbox project"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=3,<4",
  "python-docx>=1.2,<2",
  "xlrd>=2,<3",
]

[project.scripts]
goai-data = "goai_data.cli:main"
goai-agent = "goai_data.agent_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goai_data"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
